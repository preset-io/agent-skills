name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Verify required system tools
        run: |
          command -v zip
          command -v zipinfo
          command -v jq

      - name: Run smoke test
        run: ./scripts/smoke-test.sh

      - name: Build Claude web API skill ZIPs
        run: node scripts/build-claude-web-skills.mjs

      - name: Build Claude web MCP skill ZIPs
        run: |
          node scripts/build-claude-web-skills.mjs \
            --source plugins/preset-mcp-skills/skills \
            --out dist/claude-web-flat-mcp-skills

      - name: Build Claude web CLI skill ZIPs
        run: |
          node scripts/build-claude-web-skills.mjs \
            --source plugins/preset-cli-skills/skills \
            --out dist/claude-web-flat-cli-skills

      - name: Build Claude web Snowflake Cortex skill ZIPs
        run: |
          node scripts/build-claude-web-skills.mjs \
            --source plugins/preset-snowflake-cortex-skills/skills \
            --out dist/claude-web-flat-cortex-skills

      - name: Upload built archives
        uses: actions/upload-artifact@v4
        with:
          name: skill-archives
          path: |
            dist/*-openai.zip
            dist/claude-web-flat-*/*.zip
          if-no-files-found: error
